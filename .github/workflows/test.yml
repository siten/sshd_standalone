name: Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  ios-simulator:
    name: cargo test (iOS Simulator)
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain and iOS Simulator target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Boot an iPhone simulator
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | jq -r '
            [ .devices[][]
              | select(.isAvailable == true and (.name | startswith("iPhone")))
            ] | .[0].udid // empty
          ')"
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run tests
        run: |
          export SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          cargo test --target aarch64-apple-ios-sim
        env:
          CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUNNER: bash .github/ios-sim-runner.sh

  android:
    # Hosted runners have no arm64 Android device, so this links the tests only.
    name: cargo ndk test --no-run (Android arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Compile tests
        run: cargo ndk -P 23 -t arm64-v8a test --no-run
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
