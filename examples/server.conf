# sshd_standalone server config.
# Start: sshd_standalone --config examples/server.conf
#
# Blank lines and lines starting with # are ignored. A section with no
# entries does not enable that method. An omitted section is off.
# An unknown section, a bad key, or any other line outside a section
# prevents startup.
#
# host, port, and host-key are written before any section. A relative
# host-key path is resolved from this file's directory. Command-line --host,
# --port, and --host-key override these lines. Omitted values fall back to
# 0.0.0.0, port 2222, and host_key next to the executable. Inside
# [passwords], the same words are user names.

host = "0.0.0.0"
port = 2222
# host-key = "host_key"
#
# [public_keys] is one OpenSSH public key per line. Supported types:
#   ssh-ed25519
#   ssh-rsa
#   ecdsa-sha2-nistp256
#   ecdsa-sha2-nistp384
#   ecdsa-sha2-nistp521
# A listed key may log in as any user name.
#
# [certificates] is one CA public key per line, in the same OpenSSH form.
# A client user certificate must be signed by one of these keys, name the
# login user as a principal, be in its validity period, and carry no critical
# options. Interactive shell sessions also require the empty `permit-pty`
# extension; certificates without it can still run non-PTY commands or SFTP.
# RFC 4716, PEM, and X.509 certificates are not accepted.
# These sample keys have no private keys in this repository.

[public_keys]
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHAWz4RQW6vIXDEvupqb8EzNLHzNi9Rgo49XZhUU59Cv alice@laptop
#ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINVaLVrle4yePsCaC16Y3Hpd2abOYYGdvFnHQOmUssXN alice@desktop
ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBKSZqK9isAWHXscCjmQoQSmh8TjJHv8cM0QGFnqc6I7O/ZsoeXekZ+Z3VAUwNeErwM2N7SU8jnZi8x6iCMpF4Ew= alice@work

[certificates]
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILsRjqYS8VZg/BGyhyhSv76hPCZt2lCSb9Fj5tErhRGx user-ca@example
ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHkhQrnmFfa35Se0PNDoz2ol7zLGL8W00uDznDwLNDd9 backup-user-ca@example

[passwords]
alice = "example-password"
