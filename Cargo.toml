[package]
name = "sshd_standalone"
version = "0.1.0"
edition = "2021"

[dependencies]
russh = { version = "0.61", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2.3"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
rand = "0.10"
anyhow = "1"
shell-words = "1"
bytes = "1"
portable-pty = "0.9"

[[bin]]
name = "sshd_standalone"
path = "src/main.rs"

[profile.release]
strip = true       # 自动剥离所有符号表和调试信息，让体积缩减到极致
lto = true         # 顺便开启全局链接优化，进一步压缩体积、提升性能
opt-level = "z"    # 优化目标改为“最小体积”（如果对体积极其敏感的话）

