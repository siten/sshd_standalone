[package]
name = "sshd_standalone"
version = "0.1.0"
edition = "2021"

[dependencies]
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
rand = "0.10"
anyhow = "1"
shell-words = "1"
subtle = "2"
portable-pty = "0.9"

[patch.crates-io]
# Unified Windows ConPTY shutdown with cancellable pipes and completion tracking.
portable-pty = { path = "vendor/portable-pty" }

[[bin]]
name = "sshd_standalone"
path = "src/main.rs"

[profile.release]
strip = true       # Strip symbols to keep the binary small.
lto = true         # Link-time optimization for size and speed.
opt-level = "z"    # Optimize for size.

